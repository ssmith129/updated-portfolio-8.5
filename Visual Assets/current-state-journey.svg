<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="0" y="0" width="1100" height="340" rx="16" fill="#FAFBFC" stroke="#E3E8EF" stroke-width="1" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="32" y="38" font-size="11" font-weight="700" fill="#6B7280" letter-spacing="1.5" text-transform="uppercase">CURRENT-STATE JOURNEY — ONE URGENT MESSAGE</text>

  <!-- ==================== DOCTOR ROW ==================== -->
  <!-- Role label -->
  <rect x="32" y="60" width="90" height="68" rx="8" fill="#EFF6FF"/>
  <text x="77" y="99" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle" letter-spacing="1">DOCTOR</text>

  <!-- Steps -->
  <rect x="132" y="60" width="130" height="68" rx="6" fill="#EFF6FF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="197" y="99" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Open EHR</text>

  <text x="270" y="96" font-size="11" fill="#D1D5DB">→</text>

  <rect x="282" y="60" width="130" height="68" rx="6" fill="#EFF6FF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="347" y="99" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Check email</text>

  <text x="420" y="96" font-size="11" fill="#D1D5DB">→</text>

  <rect x="432" y="60" width="155" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="509" y="92" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Cross-reference</text>
  <text x="509" y="106" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Excel log</text>

  <text x="595" y="96" font-size="11" fill="#D1D5DB">→</text>

  <rect x="607" y="60" width="155" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="684" y="92" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Decide urgency</text>
  <text x="684" y="106" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">(2 min)</text>

  <text x="770" y="96" font-size="11" fill="#D1D5DB">→</text>

  <rect x="782" y="60" width="130" height="68" rx="6" fill="#EFF6FF" stroke="#E3E8EF" stroke-width="1"/>
  <text x="847" y="99" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Reply in email</text>

  <text x="920" y="96" font-size="11" fill="#D1D5DB">→</text>

  <rect x="932" y="60" width="140" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="1002" y="92" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Log in Excel</text>
  <text x="1002" y="106" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">manually</text>

  <!-- ==================== NURSE ROW ==================== -->
  <!-- Role label -->
  <rect x="32" y="140" width="90" height="68" rx="8" fill="#F0FDF4"/>
  <text x="77" y="179" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">NURSE</text>

  <!-- Steps -->
  <rect x="132" y="140" width="145" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="204" y="179" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Check paper log</text>

  <text x="285" y="176" font-size="11" fill="#D1D5DB">→</text>

  <rect x="297" y="140" width="155" height="68" rx="6" fill="#F0FDF4" stroke="#E3E8EF" stroke-width="1"/>
  <text x="374" y="179" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Open separate inbox</text>

  <text x="460" y="176" font-size="11" fill="#D1D5DB">→</text>

  <rect x="472" y="140" width="185" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="564" y="172" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">No visibility into</text>
  <text x="564" y="186" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">doctor queue</text>

  <text x="665" y="176" font-size="11" fill="#D1D5DB">→</text>

  <rect x="677" y="140" width="155" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="754" y="179" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Call doctor to verify</text>

  <text x="840" y="176" font-size="11" fill="#D1D5DB">→</text>

  <rect x="852" y="140" width="155" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="929" y="179" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Update paper log</text>

  <!-- ==================== ADMIN ROW ==================== -->
  <!-- Role label -->
  <rect x="32" y="220" width="90" height="68" rx="8" fill="#FFFBEB"/>
  <text x="77" y="259" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1">ADMIN</text>

  <!-- Steps -->
  <rect x="132" y="220" width="165" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="214" y="259" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Export data manually</text>

  <text x="305" y="256" font-size="11" fill="#D1D5DB">→</text>

  <rect x="317" y="220" width="170" height="68" rx="6" fill="#FFFBEB" stroke="#E3E8EF" stroke-width="1"/>
  <text x="402" y="259" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">Build monthly report</text>

  <text x="495" y="256" font-size="11" fill="#D1D5DB">→</text>

  <rect x="507" y="220" width="170" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="592" y="252" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Chase missing</text>
  <text x="592" y="266" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">entries</text>

  <text x="685" y="256" font-size="11" fill="#D1D5DB">→</text>

  <rect x="697" y="220" width="170" height="68" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="782" y="252" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">Forecast =</text>
  <text x="782" y="266" font-size="11" font-weight="500" fill="#991B1B" text-anchor="middle">guesswork</text>

  <!-- Legend -->
  <rect x="32" y="305" width="12" height="12" rx="3" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="50" y="315" font-size="10" fill="#6B7280">Pain point</text>
  <rect x="120" y="305" width="12" height="12" rx="3" fill="#F8FAFC" stroke="#E3E8EF" stroke-width="1"/>
  <text x="138" y="315" font-size="10" fill="#6B7280">Neutral step</text>
</svg>
