<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="1100" height="260" rx="16" ry="16" fill="#1A1F2E" stroke="#2A2F3E" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Title -->
  <text x="40" y="40" fill="#8B93A8" font-size="11" font-weight="600" letter-spacing="1.5" text-transform="uppercase">PROJECT TIMELINE — JAN – AUG 2024</text>

  <!-- Timeline connector line -->
  <line x1="72" y1="95" x2="1028" y2="95" stroke="#2A2F3E" stroke-width="2"/>

  <!-- Phase 1: Discovery -->
  <circle cx="72" cy="95" r="18" fill="#3B82F6"/>
  <text x="72" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="72" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Discovery</text>
  <text x="72" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Jan</text>
  <text x="72" y="174" fill="#6B7280" font-size="11" text-anchor="middle">Stakeholder</text>
  <text x="72" y="188" fill="#6B7280" font-size="11" text-anchor="middle">interviews</text>

  <!-- Phase 2: Research -->
  <circle cx="231" cy="95" r="18" fill="#10B981"/>
  <text x="231" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="231" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Research</text>
  <text x="231" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Feb</text>
  <text x="231" y="174" fill="#6B7280" font-size="11" text-anchor="middle">18 shadows,</text>
  <text x="231" y="188" fill="#6B7280" font-size="11" text-anchor="middle">3,000 tasks</text>

  <!-- Phase 3: Synthesis -->
  <circle cx="390" cy="95" r="18" fill="#8B5CF6"/>
  <text x="390" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="390" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Synthesis</text>
  <text x="390" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Mar</text>
  <text x="390" y="174" fill="#6B7280" font-size="11" text-anchor="middle">Journey maps,</text>
  <text x="390" y="188" fill="#6B7280" font-size="11" text-anchor="middle">insights</text>

  <!-- Phase 4: Sprint 1 -->
  <circle cx="549" cy="95" r="18" fill="#F59E0B"/>
  <text x="549" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text x="549" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Sprint 1</text>
  <text x="549" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Apr</text>
  <text x="549" y="174" fill="#6B7280" font-size="11" text-anchor="middle">AI confidence,</text>
  <text x="549" y="188" fill="#6B7280" font-size="11" text-anchor="middle">triage</text>

  <!-- Phase 5: Sprint 2 -->
  <circle cx="708" cy="95" r="18" fill="#EC4899"/>
  <text x="708" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text x="708" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Sprint 2</text>
  <text x="708" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">May</text>
  <text x="708" y="174" fill="#6B7280" font-size="11" text-anchor="middle">Scheduling,</text>
  <text x="708" y="188" fill="#6B7280" font-size="11" text-anchor="middle">alerts</text>

  <!-- Phase 6: Pilot -->
  <circle cx="869" cy="95" r="18" fill="#3B82F6"/>
  <text x="869" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">6</text>
  <text x="869" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Pilot</text>
  <text x="869" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Jun–Jul</text>
  <text x="869" y="174" fill="#6B7280" font-size="11" text-anchor="middle">6-week rollout,</text>
  <text x="869" y="188" fill="#6B7280" font-size="11" text-anchor="middle">65 staff</text>

  <!-- Phase 7: Analysis -->
  <circle cx="1028" cy="95" r="18" fill="#10B981"/>
  <text x="1028" y="100" fill="white" font-size="12" font-weight="700" text-anchor="middle">7</text>
  <text x="1028" y="140" fill="#E2E8F0" font-size="12" font-weight="600" text-anchor="middle">Analysis</text>
  <text x="1028" y="156" fill="#8B93A8" font-size="11" text-anchor="middle">Aug</text>
  <text x="1028" y="174" fill="#6B7280" font-size="11" text-anchor="middle">Metrics &amp;</text>
  <text x="1028" y="188" fill="#6B7280" font-size="11" text-anchor="middle">report</text>
</svg>
