<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 435" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect x="0" y="0" width="1100" height="435" rx="16" fill="#FAFBFC" stroke="#E3E8EF" stroke-width="1" filter="url(#shadow)"/>

  <!-- ==================== LAYER 1: Legacy Systems ==================== -->
  <!-- EHR System -->
  <rect x="100" y="32" width="260" height="72" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="230" y="63" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle">EHR System</text>
  <text x="230" y="82" font-size="10" fill="#6B7280" text-anchor="middle">Patient records</text>

  <!-- Email -->
  <rect x="400" y="32" width="260" height="72" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="530" y="63" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">Email</text>
  <text x="530" y="82" font-size="10" fill="#6B7280" text-anchor="middle">Communication</text>

  <!-- Excel -->
  <rect x="700" y="32" width="260" height="72" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="830" y="63" font-size="12" font-weight="700" fill="#6366F1" text-anchor="middle">Excel</text>
  <text x="830" y="82" font-size="10" fill="#6B7280" text-anchor="middle">Scheduling &amp; logs</text>

  <!-- ==================== ARROW 1 ==================== -->
  <line x1="530" y1="104" x2="530" y2="122" stroke="#D1D5DB" stroke-width="1"/>
  <text x="530" y="140" font-size="11" fill="#6B7280" text-anchor="middle">↓ Read-only data flow ↓</text>
  <line x1="530" y1="148" x2="530" y2="166" stroke="#D1D5DB" stroke-width="1"/>

  <!-- ==================== LAYER 2: Symplify Translation Layer ==================== -->
  <rect x="60" y="170" width="940" height="100" rx="12" fill="url(#translationGrad)" stroke="#93C5FD" stroke-width="2" opacity="0.9"/>
  <defs>
    <linearGradient id="translationGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
  </defs>

  <text x="530" y="196" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle" letter-spacing="1.5">SYMPLIFY TRANSLATION LAYER</text>

  <!-- Module boxes -->
  <rect x="90" y="210" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="190" y="236" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">AI Triage Engine</text>

  <rect x="310" y="210" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="410" y="236" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Conflict Detection</text>

  <rect x="530" y="210" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="630" y="236" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Compliance Monitor</text>

  <rect x="750" y="210" width="200" height="42" rx="8" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1"/>
  <text x="850" y="236" font-size="11" font-weight="600" fill="#1E40AF" text-anchor="middle">Alert Prioritization</text>

  <!-- ==================== ARROW 2 ==================== -->
  <line x1="530" y1="270" x2="530" y2="288" stroke="#D1D5DB" stroke-width="1"/>
  <text x="530" y="306" font-size="11" fill="#6B7280" text-anchor="middle">↓ Role-based views ↓</text>
  <line x1="530" y1="314" x2="530" y2="332" stroke="#D1D5DB" stroke-width="1"/>

  <!-- ==================== LAYER 3: User Dashboards ==================== -->
  <!-- Doctor View -->
  <rect x="100" y="336" width="260" height="72" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text x="230" y="367" font-size="12" font-weight="700" fill="#3B82F6" text-anchor="middle">Doctor View</text>
  <text x="230" y="386" font-size="10" fill="#6B7280" text-anchor="middle">Triage + scheduling</text>

  <!-- Nurse View -->
  <rect x="400" y="336" width="260" height="72" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2"/>
  <text x="530" y="367" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">Nurse View</text>
  <text x="530" y="386" font-size="10" fill="#6B7280" text-anchor="middle">Alerts + handoffs</text>

  <!-- Admin View -->
  <rect x="700" y="336" width="260" height="72" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  <text x="830" y="367" font-size="12" font-weight="700" fill="#8B5CF6" text-anchor="middle">Admin View</text>
  <text x="830" y="386" font-size="10" fill="#6B7280" text-anchor="middle">Compliance + reporting</text>
</svg>
