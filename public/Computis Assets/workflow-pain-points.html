<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computis Workflow Pain Points Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .diagram-container {
            width: 1000px;
            height: 600px;
            background: #ffffff;
            position: relative;
            border: 1px solid #e0e0e0;
        }

        /* Workflow Boxes */
        .workflow-box {
            position: absolute;
            width: 120px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.12);
            transition: transform 0.2s ease;
        }

        .workflow-box:hover {
            transform: translateY(-2px);
            box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.15);
        }

        .box-cpa {
            background: #E3F2FD;
            border: 2px solid #64B5F6;
            left: 50px;
            top: 270px;
        }

        .box-request {
            background: #F5F5F5;
            border: 2px solid #9E9E9E;
            left: 230px;
            top: 265px;
        }

        .box-engineer {
            background: #BBDEFB;
            border: 2px solid #42A5F5;
            left: 410px;
            top: 272px;
        }

        .box-python {
            background: #90CAF9;
            border: 2px solid #1E88E5;
            left: 590px;
            top: 268px;
        }

        .box-results {
            background: #C8E6C9;
            border: 2px solid #66BB6A;
            left: 770px;
            top: 270px;
        }

        /* Arrows */
        .arrow {
            position: absolute;
            stroke: #607D8B;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }

        .arrow-thick {
            stroke: #E74C3C;
            stroke-width: 3;
        }

        .arrow-return {
            stroke: #9E9E9E;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
        }

        /* Pain Point Callouts */
        .pain-point {
            position: absolute;
            background: #E74C3C;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 2px 3px 10px rgba(231, 76, 60, 0.3);
            white-space: nowrap;
            z-index: 10;
        }

        .pain-point::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }

        .pain-1 {
            left: 135px;
            top: 180px;
        }

        .pain-1::after {
            border-width: 8px 8px 0 8px;
            border-color: #E74C3C transparent transparent transparent;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pain-2 {
            left: 390px;
            top: 380px;
        }

        .pain-2::after {
            border-width: 0 8px 8px 8px;
            border-color: transparent transparent #E74C3C transparent;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pain-3 {
            left: 730px;
            top: 150px;
        }

        .pain-3::after {
            border-width: 8px 8px 0 8px;
            border-color: #E74C3C transparent transparent transparent;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Legend */
        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: #FAFAFA;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 11px;
            color: #666;
            box-shadow: 1px 1px 6px rgba(0, 0, 0, 0.08);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-box {
            width: 20px;
            height: 12px;
            margin-right: 8px;
            border-radius: 2px;
        }

        .legend-workflow {
            background: #BBDEFB;
            border: 1px solid #42A5F5;
        }

        .legend-pain {
            background: #E74C3C;
        }

        /* Title */
        .diagram-title {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <div class="diagram-title">Current Workflow: CPA Request Process</div>

        <!-- SVG for arrows -->
        <svg width="1000" height="600" style="position: absolute; top: 0; left: 0; pointer-events: none;">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#607D8B" />
                </marker>
                <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#E74C3C" />
                </marker>
                <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#9E9E9E" />
                </marker>
            </defs>

            <!-- Arrow: CPA to Request -->
            <path class="arrow arrow-thick" d="M 170 300 L 220 295" marker-end="url(#arrowhead-red)" />
            
            <!-- Arrow: Request to Engineer -->
            <path class="arrow" d="M 350 295 L 400 297" marker-end="url(#arrowhead)" />
            
            <!-- Arrow: Engineer to Python -->
            <path class="arrow arrow-thick" d="M 530 300 L 580 298" marker-end="url(#arrowhead-red)" />
            
            <!-- Arrow: Python to Results -->
            <path class="arrow" d="M 710 298 L 760 300" marker-end="url(#arrowhead)" />
            
            <!-- Return arrow: Results to CPA -->
            <path class="arrow arrow-return" d="M 830 330 Q 450 450 110 330" marker-end="url(#arrowhead-gray)" />
        </svg>

        <!-- Workflow Boxes -->
        <div class="workflow-box box-cpa">CPA</div>
        <div class="workflow-box box-request">Request</div>
        <div class="workflow-box box-engineer">Engineer</div>
        <div class="workflow-box box-python">Python Script</div>
        <div class="workflow-box box-results">Results</div>

        <!-- Pain Point Callouts -->
        <div class="pain-point pain-1">2.3 day wait</div>
        <div class="pain-point pain-2">No visibility</div>
        <div class="pain-point pain-3">Can't explain results</div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box legend-workflow"></div>
                <span>Workflow step</span>
            </div>
            <div class="legend-item">
                <div class="legend-box legend-pain"></div>
                <span>Pain point / bottleneck</span>
            </div>
        </div>
    </div>
</body>
</html>
