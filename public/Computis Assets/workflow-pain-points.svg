<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow diagram showing CPA request through engineering ticket to Python script execution, with annotations highlighting 2.3-day wait times and lack of explainability">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#F44336" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#FFFFFF"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#1a1a1a" text-anchor="middle">Current Workflow Pain Points</text>
  
  <!-- Workflow Box 1: CPA -->
  <g transform="translate(50, 120)">
    <rect width="140" height="90" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0D47A1" text-anchor="middle">CPA</text>
    <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1565C0" text-anchor="middle">Client Request</text>
  </g>
  
  <!-- Arrow 1: CPA to Request -->
  <line x1="195" y1="165" x2="240" y2="165" stroke="#F44336" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow Box 2: Request -->
  <g transform="translate(245, 120)">
    <rect width="140" height="90" rx="8" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#424242" text-anchor="middle">Request</text>
    <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="12" fill="#616161" text-anchor="middle">Email/Ticket</text>
  </g>
  
  <!-- Pain Point 1: 2.3 day wait -->
  <g transform="translate(385, 60)">
    <rect width="130" height="45" rx="6" fill="#F44336" filter="url(#shadow)"/>
    <text x="65" y="22" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">⏱️ 2.3 day wait</text>
    <text x="65" y="36" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFEBEE" text-anchor="middle">Communication gap</text>
  </g>
  <line x1="450" y1="105" x2="450" y2="120" stroke="#F44336" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Arrow 2: Request to Engineer -->
  <line x1="390" y1="165" x2="435" y2="165" stroke="#F44336" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow Box 3: Engineer -->
  <g transform="translate(440, 120)">
    <rect width="140" height="90" rx="8" fill="#2196F3" stroke="#1976D2" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Engineer</text>
    <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E3F2FD" text-anchor="middle">Manual Process</text>
  </g>
  
  <!-- Pain Point 2: No visibility -->
  <g transform="translate(580, 60)">
    <rect width="130" height="45" rx="6" fill="#F44336" filter="url(#shadow)"/>
    <text x="65" y="22" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">🚫 No visibility</text>
    <text x="65" y="36" font-family="Inter, Arial, sans-serif" font-size="11" fill="#FFEBEE" text-anchor="middle">Black box process</text>
  </g>
  <line x1="645" y1="105" x2="645" y2="120" stroke="#F44336" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Arrow 3: Engineer to Python Script -->
  <line x1="585" y1="165" x2="630" y2="165" stroke="#F44336" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow Box 4: Python Script -->
  <g transform="translate(635, 120)">
    <rect width="140" height="90" rx="8" fill="#1565C0" stroke="#0D47A1" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Python Script</text>
    <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="12" fill="#BBDEFB" text-anchor="middle">Execution</text>
  </g>
  
  <!-- Arrow 4: Python Script to Results -->
  <line x1="780" y1="165" x2="825" y2="165" stroke="#F44336" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- Workflow Box 5: Results -->
  <g transform="translate(830, 120)">
    <rect width="140" height="90" rx="8" fill="#4CAF50" stroke="#388E3C" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="50" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Results</text>
    <text x="70" y="68" font-family="Inter, Arial, sans-serif" font-size="12" fill="#E8F5E9" text-anchor="middle">Output Data</text>
  </g>
  
  <!-- Return Arrow: Results back to CPA -->
  <path d="M 900 215 L 900 280 Q 900 300, 880 300 L 120 300 Q 100 300, 100 280 L 100 215" 
        fill="none" stroke="#F44336" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  
  <!-- Pain Point 3: Can't explain results -->
  <g transform="translate(50, 330)">
    <rect width="160" height="45" rx="6" fill="#F44336" filter="url(#shadow)"/>
    <text x="80" y="18" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">❌ Can't explain</text>
    <text x="80" y="34" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">results</text>
  </g>
  <line x1="130" y1="300" x2="130" y2="330" stroke="#F44336" stroke-width="2" stroke-dasharray="4,3"/>
  
  <!-- Key Metrics Summary Box -->
  <g transform="translate(50, 420)">
    <rect width="900" height="140" rx="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="2" filter="url(#shadow)"/>
    <text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#E65100">Process Inefficiencies Summary:</text>
    
    <g transform="translate(20, 50)">
      <circle cx="6" cy="6" r="4" fill="#F44336"/>
      <text x="20" y="11" font-family="Inter, Arial, sans-serif" font-size="14" fill="#424242">Average 2.3-day turnaround from CPA request to results delivery</text>
    </g>
    
    <g transform="translate(20, 78)">
      <circle cx="6" cy="6" r="4" fill="#F44336"/>
      <text x="20" y="11" font-family="Inter, Arial, sans-serif" font-size="14" fill="#424242">Zero transparency into processing status or script execution</text>
    </g>
    
    <g transform="translate(20, 106)">
      <circle cx="6" cy="6" r="4" fill="#F44336"/>
      <text x="20" y="11" font-family="Inter, Arial, sans-serif" font-size="14" fill="#424242">CPAs unable to interpret or explain results to clients without engineering support</text>
    </g>
  </g>
</svg>
