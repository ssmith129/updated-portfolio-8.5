    <text x="490" y="175" font-family="Arial, sans-serif" font-size="20" fill="#10B981" text-anchor="middle">✓</text>
    
    <rect x="630" y="150" width="240" height="40" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="750" y="175" font-family="Arial, sans-serif" font-size="20" fill="#EF4444" text-anchor="middle">✗</text>
    
