    <!-- Computis Column Header (Highlighted) -->
    <rect x="370" y="80" width="240" height="50" fill="#3B82F6" rx="6"/>
    <text x="490" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
