<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="700" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">
    COMPUTIS IA — SITEMAP (Role-Based Permissions)
  </text>
  
  <!--Level 1: Dashboard -->
  <rect x="600" y="70" width="200" height="50" fill="#3B82F6" rx="8"/>
  <text x="700" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    Dashboard
  </text>
  
  <!-- Main Branches from Dashboard -->
  <line x1="700" y1="120" x2="700" y2="160" stroke="#6B7280" stroke-width="2"/>
  <line x1="200" y1="160" x2="1200" y2="160" stroke="#6B7280" stroke-width="2"/>
  
  <!-- Level 2: Main Navigation -->
  <g id="level-2">
    <!-- Clients -->
    <line x1="200" y1="160" x2="200" y2="200" stroke="#6B7280" stroke-width="2"/>
    <rect x="100" y="200" width="200" height="50" fill="#8B5CF6" rx="8"/>
    <text x="200" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
      Clients
    </text>
    
    <!-- Wallets -->
    <line x1="450" y1="160" x2="450" y2="200" stroke="#6B7280" stroke-width="2"/>
    <rect x="350" y="200" width="200" height="50" fill="#8B5CF6" rx="8"/>
    <text x="450" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
      Wallets
    </text>
    
    <!-- Rules -->
    <line x1="700" y1="160" x2="700" y2="200" stroke="#6B7280" stroke-width="2"/>
    <rect x="600" y="200" width="200" height="50" fill="#8B5CF6" rx="8"/>
    <text x="700" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
      Rules
    </text>
    
    <!-- Reports -->
    <line x1="950" y1="160" x2="950" y2="200" stroke="#6B7280" stroke-width="2"/>
    <rect x="850" y="200" width="200" height="50" fill="#8B5CF6" rx="8"/>
    <text x="950" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
      Reports
    </text>
    
    <!-- Settings -->
    <line x1="1200" y1="160" x2="1200" y2="200" stroke="#6B7280" stroke-width="2"/>
    <rect x="1100" y="200" width="200" height="50" fill="#8B5CF6" rx="8"/>
    <text x="1200" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
      Settings
    </text>
  </g>
  
  <!-- Level 3: Clients Sub-menu -->
  <g id="clients-submenu">
    <line x1="200" y1="250" x2="200" y2="290" stroke="#6B7280" stroke-width="2"/>
    <line x1="80" y1="290" x2="320" y2="290" stroke="#6B7280" stroke-width="2"/>
    
    <line x1="80" y1="290" x2="80" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="30" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="80" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      View All
    </text>
    
    <line x1="160" y1="290" x2="160" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="110" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="160" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Add New
    </text>
    
    <line x1="240" y1="290" x2="240" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="190" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="240" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Edit
    </text>
    
    <line x1="320" y1="290" x2="320" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="270" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="320" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Archive
    </text>
  </g>
  
  <!-- Level 3: Wallets Sub-menu -->
  <g id="wallets-submenu">
    <line x1="450" y1="250" x2="450" y2="290" stroke="#6B7280" stroke-width="2"/>
    <line x1="350" y1="290" x2="550" y2="290" stroke="#6B7280" stroke-width="2"/>
    
    <line x1="350" y1="290" x2="350" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="300" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="350" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      View
    </text>
    
    <line x1="425" y1="290" x2="425" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="375" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="425" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Import
    </text>
    
    <line x1="500" y1="290" x2="500" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="450" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="500" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Sync
    </text>
    
    <line x1="550" y1="290" x2="550" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="500" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="550" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      History
    </text>
  </g>
  
  <!-- Level 4: Transactions (Under Wallets) -->
  <g id="transactions-level">
    <line x1="450" y1="370" x2="450" y2="410" stroke="#6B7280" stroke-width="2"/>
    <rect x="350" y="410" width="200" height="50" fill="#EC4899" rx="8"/>
    <text x="450" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
      Transactions
    </text>
    
    <line x1="450" y1="460" x2="450" y2="500" stroke="#6B7280" stroke-width="2"/>
    <line x1="310" y1="500" x2="590" y2="500" stroke="#6B7280" stroke-width="2"/>
    
    <line x1="310" y1="500" x2="310" y2="540" stroke="#6B7280" stroke-width="2"/>
    <rect x="260" y="540" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="310" y="565" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Browse
    </text>
    
    <line x1="390" y1="500" x2="390" y2="540" stroke="#6B7280" stroke-width="2"/>
    <rect x="340" y="540" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="390" y="565" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Filter
    </text>
    
    <line x1="470" y1="500" x2="470" y2="540" stroke="#6B7280" stroke-width="2"/>
    <rect x="420" y="540" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="470" y="565" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Classify
    </text>
    
    <line x1="550" y1="500" x2="550" y2="540" stroke="#6B7280" stroke-width="2"/>
    <rect x="500" y="540" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="550" y="560" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Audit
    </text>
    <text x="550" y="572" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Trail
    </text>
  </g>
  
  <!-- Level 3: Rules Sub-menu -->
  <g id="rules-submenu">
    <line x1="700" y1="250" x2="700" y2="290" stroke="#6B7280" stroke-width="2"/>
    <line x1="600" y1="290" x2="800" y2="290" stroke="#6B7280" stroke-width="2"/>
    
    <line x1="600" y1="290" x2="600" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="550" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="600" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Create
    </text>
    
    <line x1="675" y1="290" x2="675" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="625" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="675" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Edit
    </text>
    
    <line x1="750" y1="290" x2="750" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="700" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="750" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Test
    </text>
    
    <line x1="800" y1="290" x2="800" y2="330" stroke="#6B7280" stroke-width="2"/>
    <rect x="750" y="330" width="100" height="40" fill="#10B981" rx="6"/>
    <text x="800" y="355" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Apply
    </text>
  </g>
  
  <!-- Role-Based Permissions Legend -->
  <g id="permissions-legend">
    <rect x="50" y="700" width="1300" height="250" fill="white" stroke="#E5E7EB" rx="8"/>
    
    <text x="700" y="735" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937" text-anchor="middle">
      ROLE-BASED PERMISSIONS
    </text>
    
    <!-- CPA Role -->
    <rect x="100" y="760" width="350" height="160" fill="#EBF8FF" stroke="#3B82F6" stroke-width="2" rx="6"/>
    <rect x="120" y="775" width="60" height="25" fill="#3B82F6" rx="4"/>
    <text x="150" y="792" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">
      CPA
    </text>
    <text x="120" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2937">
      Full Access:
    </text>
    <text x="120" y="845" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • All rule creation & editing
    </text>
    <text x="120" y="865" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • AI classification override
    </text>
    <text x="120" y="885" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Audit trail access (read/write)
    </text>
    <text x="120" y="905" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Multi-client portfolio view
    </text>
    
    <!-- Analyst Role -->
    <rect x="500" y="760" width="350" height="160" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="2" rx="6"/>
    <rect x="520" y="775" width="80" height="25" fill="#8B5CF6" rx="4"/>
    <text x="560" y="792" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">
      Analyst
    </text>
    <text x="520" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2937">
      Limited Access:
    </text>
    <text x="520" y="845" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Data ingestion & wallet sync
    </text>
    <text x="520" y="865" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Anomaly detection flagging
    </text>
    <text x="520" y="885" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Read-only audit trail
    </text>
    <text x="520" y="905" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • No rule creation/override
    </text>
    
    <!-- Admin Role -->
    <rect x="900" y="760" width="350" height="160" fill="#ECFDF5" stroke="#10B981" stroke-width="2" rx="6"/>
    <rect x="920" y="775" width="70" height="25" fill="#10B981" rx="4"/>
    <text x="955" y="792" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">
      Admin
    </text>
    <text x="920" y="820" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1F2937">
      Management:
    </text>
    <text x="920" y="845" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Multi-client operations
    </text>
    <text x="920" y="865" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Team settings & permissions
    </text>
    <text x="920" y="885" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Billing & subscription
    </text>
    <text x="920" y="905" font-family="Arial, sans-serif" font-size="11" fill="#374151">
      • Bulk rule deployment
    </text>
  </g>
  
  <!-- Annotations -->
  <g id="annotations">
    <text x="30" y="650" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">
      → Self-service entry point (no engineer needed)
    </text>
    <text x="700" y="650" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      → Audit trail accessible at every level
    </text>
    <text x="1150" y="650" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">
      → Modular structure enables expansion
    </text>
  </g>
</svg>
