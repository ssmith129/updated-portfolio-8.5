<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <!-- Background -->
  <rect width="1400" height="900" fill="#FAFAFA"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937" text-anchor="middle">
    CPA JOURNEY — CURRENT STATE (Before Computis)
  </text>
  
  <!-- Column Headers (5 Stages) -->
  <g id="stage-headers">
    <!-- Stage 1 -->
    <rect x="30" y="80" width="250" height="60" fill="#3B82F6" rx="8"/>
    <text x="155" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      1. Receive Client Data
    </text>
    
    <!-- Stage 2 -->
    <rect x="300" y="80" width="250" height="60" fill="#3B82F6" rx="8"/>
    <text x="425" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      2. Request Classification
    </text>
    
    <!-- Stage 3 -->
    <rect x="570" y="80" width="250" height="60" fill="#3B82F6" rx="8"/>
    <text x="695" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      3. Wait for
    </text>
    <text x="695" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      Engineering
    </text>
    
    <!-- Stage 4 -->
    <rect x="840" y="80" width="250" height="60" fill="#3B82F6" rx="8"/>
    <text x="965" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      4. Review + Adjust
    </text>
    
    <!-- Stage 5 -->
    <rect x="1110" y="80" width="250" height="60" fill="#3B82F6" rx="8"/>
    <text x="1235" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      5. Export for Filing
    </text>
  </g>
  
  <!-- Row 1: Actions -->
  <g id="actions-row">
    <text x="30" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">
      Actions:
    </text>
    
    <rect x="30" y="200" width="250" height="80" fill="white" stroke="#E5E7EB" rx="4"/>
    <text x="155" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Download CSVs
    </text>
    <text x="155" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Manual wallet imports
    </text>
    
    <rect x="300" y="200" width="250" height="80" fill="white" stroke="#E5E7EB" rx="4"/>
    <text x="425" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Email engineer
    </text>
    <text x="425" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Describe edge cases
    </text>
    
    <rect x="570" y="200" width="250" height="80" fill="white" stroke="#E5E7EB" rx="4"/>
    <text x="695" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Wait 2-3 days
    </text>
    <text x="695" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Follow up via Slack
    </text>
    
    <rect x="840" y="200" width="250" height="80" fill="white" stroke="#E5E7EB" rx="4"/>
    <text x="965" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Review Python output
    </text>
    <text x="965" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Spot-check errors
    </text>
    
    <rect x="1110" y="200" width="250" height="80" fill="white" stroke="#E5E7EB" rx="4"/>
    <text x="1235" y="235" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Download CSV
    </text>
    <text x="1235" y="255" font-family="Arial, sans-serif" font-size="12" fill="#1E40AF" text-anchor="middle">
      • Manual reformatting
    </text>
  </g>
  
  <!-- Row 2: Pain Points (RED HIGHLIGHTS) -->
  <g id="pain-points-row">
    <text x="30" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">
      Pain Points:
    </text>
    
    <rect x="30" y="330" width="250" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="40" y="355" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Manual CSV wrangling
    </text>
    <text x="40" y="375" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ No bulk operations
    </text>
    <text x="40" y="395" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Prone to errors
    </text>
    
    <rect x="300" y="330" width="250" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="310" y="355" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Engineer dependency
    </text>
    <text x="310" y="375" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Lost in email threads
    </text>
    <text x="310" y="395" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ No self-service
    </text>
    
    <rect x="570" y="330" width="250" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" rx="4"/>
    <text x="580" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991B1B">
      ✗ 85% TIME WAITING
    </text>
    <text x="580" y="375" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ 2-3 day turnaround
    </text>
    <text x="580" y="395" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Velocity bottleneck
    </text>
    
    <rect x="840" y="330" width="250" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="850" y="355" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Black-box AI
    </text>
    <text x="850" y="375" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ No reasoning visible
    </text>
    <text x="850" y="395" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Can't defend to IRS
    </text>
    
    <rect x="1110" y="330" width="250" height="100" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" rx="4"/>
    <text x="1120" y="355" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ CSV-only format
    </text>
    <text x="1120" y="375" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ Manual reformatting
    </text>
    <text x="1120" y="395" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ No IRS 8949 format
    </text>
  </g>
  
  <!-- Row 3: Emotions -->
  <g id="emotions-row">
    <text x="30" y="470" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">
      Emotions:
    </text>
    
    <text x="155" y="510" font-family="Arial, sans-serif" font-size="48">😐</text>
    <text x="155" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      Neutral
    </text>
    
    <text x="425" y="510" font-family="Arial, sans-serif" font-size="48">😟</text>
    <text x="425" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      Frustrated
    </text>
    
    <text x="695" y="510" font-family="Arial, sans-serif" font-size="48">😫</text>
    <text x="695" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      Very Frustrated
    </text>
    
    <text x="965" y="510" font-family="Arial, sans-serif" font-size="48">😕</text>
    <text x="965" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      Uncertain
    </text>
    
    <text x="1235" y="510" font-family="Arial, sans-serif" font-size="48">😐</text>
    <text x="1235" y="540" font-family="Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">
      Relieved
    </text>
  </g>
  
  <!-- Row 4: Time Spent -->
  <g id="time-row">
    <text x="30" y="590" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2937">
      Time Spent:
    </text>
    
    <rect x="30" y="600" width="250" height="50" fill="#FEF3C7" stroke="#F59E0B" rx="4"/>
    <text x="155" y="632" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">
      15 min
    </text>
    
    <rect x="300" y="600" width="250" height="50" fill="#FEF3C7" stroke="#F59E0B" rx="4"/>
    <text x="425" y="632" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">
      10 min
    </text>
    
    <rect x="570" y="600" width="250" height="50" fill="#FEE2E2" stroke="#EF4444" stroke-width="3" rx="4"/>
    <text x="695" y="625" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#991B1B" text-anchor="middle">
      2-3 DAYS
    </text>
    <text x="695" y="642" font-family="Arial, sans-serif" font-size="11" fill="#991B1B" text-anchor="middle">
      (85% of total time)
    </text>
    
    <rect x="840" y="600" width="250" height="50" fill="#FEF3C7" stroke="#F59E0B" rx="4"/>
    <text x="965" y="632" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">
      45 min
    </text>
    
    <rect x="1110" y="600" width="250" height="50" fill="#FEF3C7" stroke="#F59E0B" rx="4"/>
    <text x="1235" y="632" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#92400E" text-anchor="middle">
      30 min
    </text>
  </g>
  
  <!-- Total Time Banner -->
  <rect x="400" y="700" width="600" height="80" fill="#1F2937" rx="8"/>
  <text x="700" y="735" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFD700" text-anchor="middle">
    TOTAL TIME: 2.5 HOURS
  </text>
  <text x="700" y="760" font-family="Arial, sans-serif" font-size="14" fill="#D1D5DB" text-anchor="middle">
    (per client, per classification request)
  </text>
  
  <!-- Key Takeaways -->
  <g id="takeaways">
    <text x="30" y="830" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#EF4444">
      Critical Issues:
    </text>
    <text x="30" y="855" font-family="Arial, sans-serif" font-size="12" fill="#991B1B">
      ✗ 85% time waiting for engineers  ✗ No audit trail  ✗ Black-box AI  ✗ Frequent FMV errors  ✗ CSV-only exports
    </text>
  </g>
</svg>
