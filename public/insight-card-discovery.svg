<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F9F4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0A2540" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="8" y="8" width="304" height="344" rx="12" ry="12"
        fill="url(#cardBg)" stroke="#E3E8EF" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Icon container -->
  <rect x="32" y="32" width="40" height="40" rx="8" ry="8" fill="#E0F9F4"/>

  <!-- Brain icon (lucide) -->
  <g transform="translate(42, 42)" fill="none" stroke="#00D4AA" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
    <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
    <path d="M6 18a4 4 0 0 1-1.967-.516"/>
    <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
  </g>

  <!-- Label -->
  <text x="84" y="59" font-size="12" font-weight="600"
        fill="#00D4AA" letter-spacing="1.2">DISCOVERY</text>

  <!-- Title -->
  <text x="32" y="112" font-size="20" font-weight="700" fill="#0A2540">
    Trust &gt; Speed
  </text>

  <!-- Description (wrapped) -->
  <g font-size="14" fill="#4A5568">
    <text x="32" y="148">
      <tspan x="32" dy="0">CPAs rejected automation that</tspan>
      <tspan x="32" dy="20">removed their judgment.</tspan>
      <tspan x="32" dy="20">Professional liability made</tspan>
      <tspan x="32" dy="20">transparency non-negotiable.</tspan>
    </text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="278" x2="288" y2="278" stroke="#E3E8EF" stroke-width="1"/>

  <!-- Stat -->
  <text x="32" y="312" font-size="22" font-weight="700" fill="#00D4AA">12</text>
  <text x="60" y="312" font-size="12" fill="#6B7280">CPA interviews</text>
</svg>
